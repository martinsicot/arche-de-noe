<!DOCTYPE html>
<html lang="fr" data-theme="nature">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message envoyé - L'Arche de Noé</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/css/output.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-primary/10 via-secondary/10 to-accent/10 flex items-center justify-center">
    <div class="container mx-auto px-4">
        <div class="max-w-lg mx-auto bg-white rounded-2xl shadow-xl p-8 text-center">
            <div class="w-20 h-20 bg-secondary/20 rounded-full mx-auto mb-6 flex items-center justify-center">
                <i data-lucide="check-circle" class="w-10 h-10 text-secondary"></i>
            </div>

            <h1 class="text-3xl font-heading font-bold text-dark mb-4">Merci pour votre message !</h1>

            <p class="text-dark/70 mb-8">
                Votre demande a bien été envoyée. Nous vous répondrons dans les plus brefs délais.
            </p>

            <a href="/" class="btn-primary inline-flex items-center gap-2">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                Retour à l'accueil
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
